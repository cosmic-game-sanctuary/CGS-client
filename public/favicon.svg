<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#FFE800"/>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="none" stroke="#16130F" stroke-width="2"/>
  <!-- Saturn, at .85 of the mark in src/components/Logo.tsx so it clears the
       badge border. Planet minus ring, plus ring minus planet. -->
  <mask id="r" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <ellipse cx="16" cy="17.63" rx="12.38" ry="4.08" transform="rotate(-16 16 17.63)"
             fill="none" stroke="#000" stroke-width="2.45"/>
  </mask>
  <mask id="p" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32">
    <rect width="32" height="32" fill="#fff"/>
    <circle cx="16" cy="15.46" r="8.7" fill="#000"/>
  </mask>
  <circle cx="16" cy="15.46" r="8.7" fill="#16130F" mask="url(#r)"/>
  <ellipse cx="16" cy="17.63" rx="12.38" ry="4.08" transform="rotate(-16 16 17.63)"
           fill="none" stroke="#16130F" stroke-width="2.45" mask="url(#p)"/>
